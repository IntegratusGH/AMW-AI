{# Reusable image viewer with zoom / rotate / pan.  Any button with class
   'view-img' and data-img (+ optional data-title) opens it. #}
{% from "main/_icons.html" import icon %}
<div class="img-modal" id="imgModal" hidden>
  <div class="img-modal__backdrop" data-close></div>
  <div class="img-modal__dialog" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="img-modal__bar">
      <span class="img-modal__title"></span>
      <div class="img-modal__tools">
        <button type="button" class="act-btn" data-act="zoom-out" title="Zoom out" aria-label="Zoom out">{{ icon('zoom-out', 18) }}</button>
        <button type="button" class="act-btn" data-act="zoom-in" title="Zoom in" aria-label="Zoom in">{{ icon('zoom-in', 18) }}</button>
        <button type="button" class="act-btn" data-act="rotate" title="Rotate" aria-label="Rotate">{{ icon('rotate', 18) }}</button>
        <button type="button" class="act-btn" data-act="reset" title="Reset" aria-label="Reset">{{ icon('refresh', 18) }}</button>
        <button type="button" class="act-btn" data-close title="Close" aria-label="Close">{{ icon('x', 18) }}</button>
      </div>
    </div>
    <div class="img-modal__canvas"><img class="img-modal__img" alt="Image" draggable="false"></div>
  </div>
</div>

<script>
(function () {
  var modal = document.getElementById('imgModal');
  if (!modal) return;
  var img = modal.querySelector('.img-modal__img');
  var canvas = modal.querySelector('.img-modal__canvas');
  var title = modal.querySelector('.img-modal__title');
  var scale = 1, rot = 0, tx = 0, ty = 0, drag = null;

  function apply() {
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ') rotate(' + rot + 'deg)';
  }
  function reset() { scale = 1; rot = 0; tx = 0; ty = 0; apply(); }
  function open(src, label) {
    img.src = src; title.textContent = label || '';
    reset(); modal.hidden = false; document.body.style.overflow = 'hidden';
  }
  function close() { modal.hidden = true; img.src = ''; document.body.style.overflow = ''; }

  document.querySelectorAll('.view-img').forEach(function (btn) {
    btn.addEventListener('click', function () {
      open(btn.getAttribute('data-img'), btn.getAttribute('data-title'));
    });
  });
  modal.querySelectorAll('[data-close]').forEach(function (el) {
    el.addEventListener('click', close);
  });
  modal.querySelectorAll('[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var a = b.getAttribute('data-act');
      if (a === 'zoom-in') scale = Math.min(8, scale * 1.25);
      else if (a === 'zoom-out') scale = Math.max(0.2, scale / 1.25);
      else if (a === 'rotate') rot = (rot + 90) % 360;
      else if (a === 'reset') { reset(); return; }
      apply();
    });
  });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    scale = e.deltaY < 0 ? Math.min(8, scale * 1.1) : Math.max(0.2, scale / 1.1);
    apply();
  }, { passive: false });
  img.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX - tx, y: e.clientY - ty };
    img.setPointerCapture(e.pointerId);
  });
  img.addEventListener('pointermove', function (e) {
    if (!drag) return;
    tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply();
  });
  img.addEventListener('pointerup', function () { drag = null; });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) close();
  });
})();
</script>
